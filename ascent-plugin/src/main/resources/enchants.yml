# Custom enchants (PRD Epic 3, §6.4.4). The book lottery is the heart of the
# game: an unopened book of a tier reveals into an enchant, a level, a
# success% and a destroy%, and applying it is a single roll.
#
# These numbers are our own tunable defaults; the original Cosmic values could
# not be verified (PRD §0).

tiers:
  SIMPLE:
    color: "<white>"
    xp-levels: 10
    success: [60, 100]
    destroy: [0, 20]
    min-rank: 1
  UNIQUE:
    color: "<green>"
    xp-levels: 20
    success: [50, 95]
    destroy: [5, 35]
    min-rank: 5
  ELITE:
    color: "<aqua>"
    xp-levels: 35
    success: [40, 90]
    destroy: [10, 50]
    min-rank: 15
  ULTIMATE:
    color: "<yellow>"
    xp-levels: 55
    success: [30, 80]
    destroy: [20, 70]
    min-rank: 25
  LEGENDARY:
    color: "<gold>"
    xp-levels: 90
    success: [20, 70]
    destroy: [30, 90]
    min-rank: 40

# The Tinkerer (PRD E3-S7) buys opened books and enchanted gear for XP bottles.
#   book-value-percent   an opened book pays this % of its tier's xp-levels
#   gear-value-percent   enchanted gear pays this % of the sum of its enchants' book values
#   dust-chance-percent  chance per book of dust-min-tier or above to also return
#                        Magic Dust of the book's tier, with a percent from dust-percent
# Unopened books, scrolls and dust are not accepted.
tinkerer:
  book-value-percent: 40
  gear-value-percent: 50
  dust-chance-percent: 10
  dust-min-tier: ELITE
  dust-percent: [1, 8]

# The Alchemist (PRD E3-S8) fuses two identical books into the next level for
# the tier's xp-levels times the books' level, and two dusts of one tier into a
# dust of the next tier for a flat fee.
alchemist:
  dust-cost-levels: 5

# The enchant catalog (PRD E3-S1). One entry per enchant:
#   display        the name players see
#   tier           SIMPLE | UNIQUE | ELITE | ULTIMATE | LEGENDARY
#   applies-to     HELMET CHESTPLATE LEGGINGS BOOTS SWORD AXE BOW PICKAXE HOE
#                  ALL_ARMOR ALL_WEAPONS
#   max-level      1..10
#   description    one MiniMessage line, or a map of level -> line; <param>
#                  placeholders are filled from effect.per-level at that level
#   effect.type    what it does (see below); effect.potion / target / condition
#                  are options, effect.per-level holds one value per level (or a
#                  single number for every level)
#   cooldown-ticks minimum ticks between procs on one player
#
# Effect types and their per-level parameters:
#   POTION_ON_HIT, POTION_ON_HURT   potion, target (TARGET|SELF|ATTACKER); amplifier, duration (s), chance (%)
#   POTION_PASSIVE                  potion; amplifier
#   DAMAGE_MULTIPLIER               condition?; multiplier, chance
#   DAMAGE_REDUCTION_STACKABLE      condition?; percent, chance   (summed across pieces, capped at 60%)
#   LIFESTEAL                       heal (hearts), chance
#   EXTRA_HEARTS                    hearts
#   HEAL_ON_KILL                    heal (hearts)
#   LIGHTNING_ON_ARROW              chance, damage (hearts)
#   AUTO_SMELT, TELEPATHY           (none)
#   NO_DURABILITY_LOSS              chance
#   KNOCKBACK_MULTIPLIER            multiplier, chance
#   DOUBLE_STRIKE                   chance
#   SILENCE                         chance, duration (s)
#   BONUS_XP                        percent, chance
# Conditions: SELF_BELOW_HP:<percent>, TARGET_BELOW_HP:<percent>, SELF_HOLDING:<target>,
#             TARGET_HOLDING:<target>, ATTACKER_HOLDING:<target>, ATTACKER_PROJECTILE
# Potion FIRE means "set on fire for duration".
#
# Effects follow the design bible descriptions; every number is ours to tune.
enchants:
  # --- Simple ---------------------------------------------------------------
  aquatic:
    display: "Aquatic"
    tier: SIMPLE
    applies-to: [HELMET]
    max-level: 1
    description: "Breathe underwater"
    effect: { type: POTION_PASSIVE, potion: WATER_BREATHING, per-level: { amplifier: 0 } }
  glowing:
    display: "Glowing"
    tier: SIMPLE
    applies-to: [HELMET]
    max-level: 1
    description: "See in the dark"
    effect: { type: POTION_PASSIVE, potion: NIGHT_VISION, per-level: { amplifier: 0 } }
  haste:
    display: "Haste"
    tier: SIMPLE
    applies-to: [PICKAXE]
    max-level: 3
    description: "Mine faster (Haste <level_display>)"
    effect: { type: POTION_PASSIVE, potion: HASTE, per-level: { amplifier: [0, 1, 2], level_display: [1, 2, 3] } }
  auto_smelt:
    display: "Auto Smelt"
    tier: SIMPLE
    applies-to: [PICKAXE]
    max-level: 1
    description: "Ores drop smelted"
    effect: { type: AUTO_SMELT }
  experience:
    display: "Experience"
    tier: SIMPLE
    applies-to: [PICKAXE]
    max-level: 3
    description: "<percent>% more rank XP from mining"
    effect: { type: BONUS_XP, per-level: { percent: [10, 20, 30], chance: 100 } }
  obliterate:
    display: "Obliterate"
    tier: SIMPLE
    applies-to: [SWORD, AXE]
    max-level: 3
    description: "<chance>% chance to knock enemies back x<multiplier>"
    effect: { type: KNOCKBACK_MULTIPLIER, per-level: { multiplier: [1.5, 2.0, 2.5], chance: [10, 15, 20] } }
    cooldown-ticks: 20
  lightning:
    display: "Lightning"
    tier: SIMPLE
    applies-to: [BOW]
    max-level: 3
    description: "<chance>% chance for arrows to strike lightning (<damage> hearts)"
    effect: { type: LIGHTNING_ON_ARROW, per-level: { chance: [5, 8, 12], damage: [1, 1.5, 2] } }
    cooldown-ticks: 40
  confusion:
    display: "Confusion"
    tier: SIMPLE
    applies-to: [SWORD]
    max-level: 3
    description: "<chance>% chance to confuse enemies for <duration>s"
    effect: { type: POTION_ON_HIT, potion: NAUSEA, per-level: { amplifier: 0, duration: [3, 4, 5], chance: [6, 9, 12] } }
    cooldown-ticks: 60

