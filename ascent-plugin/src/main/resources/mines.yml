# Personal mines (PRD E4-S1): instanced, tiered, solo-safe. Tier is unlocked by
# personal rank; sell value scales with tier.

# The dedicated void world that holds the plot grid.
world: mines

# Plot edge length in blocks; plots are square.
plot-size: 64

# A plot nobody has used for this long is released back to the pool.
plot-inactivity: 24h

reset:
  # Reset on a timer, or earlier once this fraction of blocks is mined.
  interval: 10m
  mined-fraction: 0.7

# How a plot is built when its tier has no schematic file: a bedrock slab with
# a square pit of ore in the middle and the spawn point on the rim. A tier's
# schematic, when the file exists, is pasted instead with its corner at the
# plot origin.
layout:
  # The walkable surface. The top layer of ore is at this height.
  surface-y: 64
  # Layers of ore, counting the surface layer.
  pit-depth: 24
  # Blocks between the plot edge and the pit on every side.
  pit-inset: 8
  # Glass wall height around the plot above the surface.
  wall-height: 3

# Per tier: the FAWE schematic pasted on allocation and reset, and the block
# mix as percentages that must sum to 100.
tiers:
  tier1:
    schematic: mines/tier1.schem
    blocks:
      STONE: 70
      COAL_ORE: 25
      IRON_ORE: 5
  tier2:
    schematic: mines/tier2.schem
    blocks:
      STONE: 40
      IRON_ORE: 35
      GOLD_ORE: 20
      DIAMOND_ORE: 5
  tier3:
    schematic: mines/tier3.schem
    blocks:
      IRON_ORE: 30
      GOLD_ORE: 30
      DIAMOND_ORE: 30
      EMERALD_ORE: 10
