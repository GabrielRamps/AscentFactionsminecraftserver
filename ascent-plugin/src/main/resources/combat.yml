# Combat tag and the logger NPC (PRD E9-S1). 1.8 combat mechanics themselves
# are OldCombatMechanics' job; see server/PLUGINS.md.

# Damaging or being damaged by another player tags both for this long,
# refreshed on every hit. Ends on death, timeout, or both parties in safezones.
tag-seconds: 15

# Logging out while tagged leaves a stand-in with your skin, health, armour
# and inventory for this long. Killing it counts as killing you.
logger-npc-seconds: 30

# Root commands refused while tagged, without the slash. "f home" is matched
# as the /f command with the "home" subcommand.
blocked-commands-while-tagged:
  - f home
  - f fly
  - spawn
  - mine
  - kit
  - shop
  - enchanter
  - tinkerer
  - alchemist
  - trade

# Gear gating (PRD E9-S2). Modern items that break the 1.8 meta cannot be
# crafted or picked up, and are deleted from an inventory when it opens.
# Material names as in https://jd.papermc.io/paper/1.21/org/bukkit/Material.html
gear:
  banned-items: [SHIELD, ELYTRA, TRIDENT, CROSSBOW, TOTEM_OF_UNDYING, END_CRYSTAL]
  # Any material whose name starts with one of these is banned as well.
  banned-prefixes: [NETHERITE_]
  # God apples (enchanted golden apples) can be eaten this often; the client
  # shows the cooldown on the item. Ordinary golden apples keep the old
  # values through OldCombatMechanics.
  god-apple-cooldown-seconds: 60
  enderpearl-cooldown-seconds: 16
