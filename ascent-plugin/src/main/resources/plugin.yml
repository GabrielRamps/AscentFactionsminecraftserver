name: Ascent
version: ${version}
main: gg.ascent.plugin.AscentPlugin
api-version: '${apiVersion}'
description: Ascent Factions core plugin.
authors: [Ascent]
load: POSTWORLD

# Ascent runs without any of these, but uses them when present:
#   Vault          economy bridge for third-party plugins
#   PlaceholderAPI scoreboard, tab and chat placeholders
#   LuckPerms      permissions and group lookups
softdepend:
  - Vault
  - PlaceholderAPI
  - LuckPerms
  - FastAsyncWorldEdit

commands:
  ascent:
    description: Ascent administrative commands.
    usage: /ascent version
    permission: ascent.admin
  bal:
    description: Show a balance.
    usage: /bal [player]
    aliases: [balance, money]
    permission: ascent.economy.use
  pay:
    description: Send money to another player.
    usage: /pay <player> <amount>
    permission: ascent.economy.use
  baltop:
    description: The richest players.
    usage: /baltop
    permission: ascent.economy.use
  rank:
    description: Your rank, the leaderboard, and what each rank unlocks.
    usage: /rank [top|unlocks]
    permission: ascent.rank.use
  kit:
    description: Open the kit menu or claim a kit.
    usage: /kit [name]
    aliases: [kits]
    permission: ascent.kit.use
  mine:
    description: Teleport to your personal mine.
    usage: /mine
    permission: ascent.mines.use
  sell:
    description: Sell every sellable item in your inventory.
    usage: /sell
    permission: ascent.economy.sell

permissions:
  ascent.admin:
    description: Access to the /ascent administrative command.
    default: op
  ascent.economy.use:
    description: /bal, /pay and /baltop.
    default: true
  ascent.rank.use:
    description: /rank, /rank top and /rank unlocks.
    default: true
  ascent.kit.use:
    description: /kit.
    default: true
  ascent.mines.use:
    description: /mine.
    default: true
  ascent.economy.sell:
    description: /sell.
    default: true
  ascent.staff.alerts:
    description: Receive dupe and other staff alerts in game.
    default: op
