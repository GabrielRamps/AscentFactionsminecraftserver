# Every player-facing string. MiniMessage formatting:
# https://docs.advntr.dev/minimessage/format.html
#
# Placeholders are written <name> and filled by the code that sends the
# message; each message documents the ones it accepts. <prefix> is always
# available and is the "prefix" value below.

prefix: "<gradient:#f2c14e:#f78154>Ascent</gradient> <dark_gray>»</dark_gray> "

ascent:
  usage: "<prefix><gray>Usage: <white>/ascent <version|reload|give|rank|debug|item>"
  # <player>: the name that was typed
  unknown-player: "<prefix><red>No player named <white><player></white> has ever joined."
  # <player>
  not-online: "<prefix><red><player> must be online for that."
  give:
    usage: "<prefix><gray>Usage: <white>/ascent give <player> <money|xp> <amount> <dark_gray>| <white>/ascent give <player> books <tier> [amount]"
    bad-amount: "<prefix><red>Amount must be a whole number of at least 1."
    # <kind>: what was asked for
    not-yet: "<prefix><yellow>Giving <kind> arrives with the enchant and spawner epics; not available yet."
    # <player>, <amount>, <balance>
    money: "<prefix><green>Gave <amount> to <white><player></white>; balance is now <balance>."
    # <player>, <amount>, <xp>
    xp: "<prefix><green>Gave <amount> XP to <white><player></white>; they now have <xp> toward the next rank."
    bad-tier: "<prefix><red>Tier must be one of SIMPLE, UNIQUE, ELITE, ULTIMATE, LEGENDARY."
    # <player>, <amount>, <tier>
    books: "<prefix><green>Gave <amount> unopened <tier> book(s) to <white><player></white>."
    # <player>, <amount>, <levels>
    xpbottle: "<prefix><green>Gave <amount> XP bottle(s) of <levels> levels to <white><player></white>."
    bad-xpbottle: "<prefix><red>Usage: /ascent give <player> xpbottle <levels 1-1000> [amount 1-64]"
    # <player>, <amount>
    scrolls: "<prefix><green>Gave <amount> White Scroll(s) to <white><player></white>."
    bad-dust: "<prefix><red>Dust is <white>/ascent give <player> dust <tier> <percent 1-15> [amount]</white>."
    # <player>, <amount>, <tier>, <percent>
    dust: "<prefix><green>Gave <amount> <tier> Magic Dust +<percent>% to <white><player></white>."
  rank:
    usage: "<prefix><gray>Usage: <white>/ascent rank <set|add> <player> <number>"
    # <max>
    bad-rank: "<prefix><red>Rank must be between 1 and <max>."
    # <player>, <rank>
    ok: "<prefix><green><player> is now rank <white><rank></white>."
  debug:
    usage: "<prefix><gray>Usage: <white>/ascent debug <tps|db|items>"
    # <tps1>, <tps5>, <tps15>, <mspt>
    tps: "<prefix><gray>TPS <white><tps1></white> / <white><tps5></white> / <white><tps15></white> (1m/5m/15m), <white><mspt></white> ms per tick"
    # <active>, <idle>, <total>, <waiting>, <queued>, <completed>, <failed>, <redis>, <pending>, <online>
    db: "<prefix><gray>Pool <white><active></white> active, <white><idle></white> idle of <white><total></white>; <white><waiting></white> waiting. Tasks: <white><queued></white> queued, <white><completed></white> done, <red><failed></red> failed. Redis <white><redis></white>. Players: <white><online></white> online, <white><pending></white> logging in."
    # <ms>
    db-ping: "<prefix><gray>Database round trip: <white><ms> ms"
    # <tagged>, <events>, <seen>, <findings>, <open>, <discord>
    items: "<prefix><gray>Registry: <white><tagged></white> items tagged and <white><events></white> events logged since startup. Last dupe scan saw <white><seen></white> tagged item(s) and raised <red><findings></red> alert(s); <white><open></white> alert(s) still open. Discord <white><discord></white>."
  item:
    usage: "<prefix><gray>Usage: <white>/ascent item lookup <item-id>"
    bad-id: "<prefix><red>That is not an item id. Ids look like <white>0199a0c4-4f2a-7c3e-9a1b-2f3c4d5e6f70</white>."
    # <item>
    unknown: "<prefix><red>No item with id <white><item></white> is registered."
    # <item>, <kind>, <quantity>, <creator>, <reason>, <created>, <destroyed>
    header: "<prefix><gold><kind></gold> <gray>x<quantity>, id <white><item></white><newline><gray>Created <white><created></white> by <white><creator></white> (<reason>); destroyed: <white><destroyed>"
    # <data>
    data: "<dark_gray>  data: <gray><data>"
    # <time>, <event>, <actor>, <counterparty>, <context>
    event: "<dark_gray> - <gray><time> <white><event></white> by <white><actor></white><counterparty> <dark_gray><context>"
    # <counterparty>
    with: " <gray>with <white><counterparty></white>"
    none: "<gray>(no events recorded)"
  # <version>
  version: "<prefix><gray>Version <white><version>"
  reload:
    # <count>: files reloaded
    ok: "<prefix><green>Reloaded <count> configuration files."
    # <count>: files that failed
    failed: "<prefix><red>Reloaded with <count> error(s); the failing files kept their old values:"
    # <error>: file, path and reason
    error: "<dark_gray> - <red><error>"

player:
  # Shown as the kick reason when the database cannot load a player's data.
  load-failed: "<red>Your player data could not be loaded.<newline><gray>Please try again in a moment. If this keeps happening, tell staff."

economy:
  # <player>: the name that was typed
  unknown-player: "<prefix><red>No player named <white><player></white> has ever joined."
  bal:
    # <amount>
    own: "<prefix><gray>Balance: <green><amount>"
    # <player>, <amount>
    other: "<prefix><gray><player>'s balance: <green><amount>"
    console: "<prefix><gray>Console has no balance. Try <white>/bal <player>"
  pay:
    usage: "<prefix><gray>Usage: <white>/pay <player> <amount>"
    console: "<prefix><red>Only players can pay."
    self: "<prefix><red>You cannot pay yourself."
    # <input>: what was typed
    bad-amount: "<prefix><red>'<input>' is not an amount. Use whole dollars, like <white>500</white> or <white>2.5k</white>."
    # <amount>, <balance>
    insufficient: "<prefix><red>You need <amount> but only have <balance>."
    # <player>, <amount>
    sent: "<prefix><green>Sent <amount> to <white><player></white>."
    # <player>, <amount>
    received: "<prefix><green>Received <amount> from <white><player></white>."
  baltop:
    header: "<prefix><gold>Richest players"
    empty: "<gray>Nobody has a balance yet."
    # <position>, <player>, <amount>
    entry: "<dark_gray> <position>. <white><player> <dark_gray>- <green><amount>"

# Item lore (E11-S3). The enchant lines themselves take their color from the
# tier in enchants.yml.
lore:
  protected: "<white>PROTECTED"
  footer:
    gear: "<dark_gray>Ascent gear"
  # <count>: enchants on the item; appended to the display name
  name-count: "<gray>[<count>]"

rank:
  usage: "<prefix><gray>Usage: <white>/rank [top|unlocks]"
  console: "<prefix><gray>Console has no rank. Try <white>/rank top"
  show:
    # <rank>, <max>, <xp>, <needed>, <percent>, <bar>, <banked>
    progress: "<prefix><gray>Rank <gold><rank></gold><dark_gray>/<max> <green><bar> <white><percent>% <dark_gray>(<xp>/<needed> XP)"
    top: "<prefix><gray>Rank <gold><rank></gold><dark_gray>/<max> <gold>MAX <gray>with <white><banked></white> XP banked for prestige."
    # <rank>, <unlock>
    next: "<dark_gray>  Next: <gray>rank <white><rank></white> unlocks <unlock>"
  up:
    # <rank>, <previous>
    chat: "<prefix><gold><bold>RANK UP!</bold> <gray>You are now rank <white><rank></white>."
    title: "<gold><bold>RANK <rank>"
    subtitle: "<gray>Rank <previous> <dark_gray>➜ <white>Rank <rank>"
  top:
    header: "<prefix><gold>Top ranks"
    empty: "<gray>Nobody has ranked up yet."
    # <position>, <player>, <rank>, <xp>
    entry: "<dark_gray> <position>. <white><player> <dark_gray>- <gold>Rank <rank> <dark_gray>(<xp> XP in)"
  unlocks:
    header: "<prefix><gold>Rank unlocks"
    # <rank>, <unlock>
    open: "<dark_gray> <green>✔ <gray>Rank <white><rank></white>: <unlock>"
    locked: "<dark_gray> <red>✘ <gray>Rank <white><rank></white>: <unlock>"
  # <name> in each
  unlock:
    enchant-slot: "<aqua><name> enchant slots per item"
    book-tier: "<aqua><name> books at the Enchanter"
    mine-tier: "<aqua>Mine tier <name>"
    kit: "<aqua>/kit <name>"

kit:
  console: "<prefix><gray>Kits are for players. Try it in game."
  # <kit>
  claimed: "<prefix><green>Claimed kit <white><kit></white>."
  unknown: "<prefix><red>There is no kit called <white><kit></white>."
  # <kit>, <rank>
  locked: "<prefix><red>Kit <white><kit></white> unlocks at rank <white><rank></white>."
  # <kit>, <time>
  cooldown: "<prefix><red>Kit <white><kit></white> is ready again in <white><time></white>."
  not-ready: "<prefix><yellow>Your kits are still loading; try again in a moment."
  # <count>: stacks that did not fit and were dropped at your feet
  dropped: "<prefix><yellow>Your inventory was full; <count> stack(s) dropped at your feet."
  menu:
    title: "<dark_gray>Kits"
    # <rank>
    locked: "<red>Unlocks at rank <rank>"
    # <time>
    cooldown: "<yellow>Ready in <time>"
    ready: "<green>Click to claim"
    # <amount>, <item>
    item: "<dark_gray>- <gray><amount>x <item>"

mine:
  console: "<prefix><gray>Mines are for players."
  building: "<prefix><gray>Building your mine..."
  # <tier>
  upgraded: "<prefix><green>Your mine is now tier <white><tier></white>. Refilling it..."
  # <tier>, <plot>
  welcome: "<prefix><gray>Welcome to your tier <white><tier></white> mine. It refills every 10 minutes or when mostly mined. <white>/sell</white> when you are full."
  resetting: "<prefix><yellow>Your mine is refilling."
  not-yours: "<prefix><red>That is someone else's mine."

sell:
  console: "<prefix><gray>Selling is for players."
  nothing: "<prefix><yellow>Nothing in your inventory can be sold. Ore and stone from the mines can."
  header: "<prefix><gold>Sold:"
  # <count>, <item>, <total>
  line: "<dark_gray> - <gray><count>x <white><item> <dark_gray>for <green><total>"
  # <total>, <balance>
  total: "<prefix><green>+<total></green> <gray>(balance <white><balance></white>)"

enchant:
  # <enchant>: "Lifesteal III"; <success>, <destroy>: percents
  revealed: "<prefix><gray>Revealed <white><enchant></white>: <green><success>% success</green>, <red><destroy>% destroy</red>."
  # <count>
  revealed-stack: "<prefix><gray>Revealed <white><count></white> books."
  opened-hint: "<prefix><gray>This book is already open. Pick it up and click it onto a piece of gear to apply it."
  apply:
    # <enchant> in each, e.g. "Lifesteal III"; <applies>: what the book fits
    not-gear: "<prefix><red>Books go on gear. <white><enchant></white> fits: <applies>."
    wrong-item: "<prefix><red><enchant> does not fit that. It applies to: <white><applies></white>."
    slots-full: "<prefix><red>That item has no free enchant slots at your rank."
    already-has: "<prefix><red>That item already has <enchant> at this level or higher."
    success: "<prefix><green><bold>SUCCESS!</bold> <gray><white><enchant></white> is on your item."
    failed: "<prefix><yellow>The book crumbled. <gray>Your item is unchanged."
    destroyed: "<prefix><red><bold>DESTROYED!</bold> <gray>The item shattered under <white><enchant></white>."
    scroll-saved: "<prefix><white><bold>PROTECTED.</bold> <gray>The roll would have destroyed your item; the White Scroll took the blow."
  scroll:
    applied: "<prefix><white><bold>PROTECTED.</bold> <gray>The next destroy roll spends the scroll instead of the item."
    already: "<prefix><red>That item is already protected."
    not-gear: "<prefix><red>White Scrolls go on gear."
  dust:
    not-book: "<prefix><red>Magic Dust goes on an opened book."
    # <tier>
    wrong-tier: "<prefix><red>That dust only works on <white><tier></white> books."
    already-max: "<prefix><red>That book already has 100% success."
    # <percent>, <success>
    applied: "<prefix><green>+<percent>% <gray>success. The book is now at <white><success>%</white>."

enchanter:
  console: "<prefix><gray>The Enchanter is for players."
  title: "<dark_gray>Enchanter"
  lore:
    # <cost>
    cost: "<gray>Cost: <green><cost> levels</green> each"
    # <levels>
    have: "<gray>You have <white><levels></white> levels"
    buy: "<dark_gray>Left-click 1, right-click 8, shift-click 16"
    # <rank>
    locked: "<red>Unlocks at rank <rank>"
  # <count>, <tier>, <cost>, <levels>
  too-poor: "<prefix><red>You need <white><cost></white> levels for <count> <tier> book(s); you have <levels>."
  bought: "<prefix><green>Bought <white><count></white> <tier> book(s) for <white><cost></white> levels."

tinkerer:
  console: "<prefix><gray>The Tinkerer is for players."
  title: "<dark_gray>Tinkerer"
  divider: "<gray>Offer on the left, returns on the right"
  filler: " "
  preview:
    # <levels>: total for the stack
    bottle: "<gray>Worth <green><levels></green> XP levels"
    # <chance>, <tier>
    dust: "<gray><chance>% chance of <tier> Magic Dust per book"
    rejected: "<red>Not accepted"
    rejected-hint: "<gray>Opened books and enchanted gear only."
  confirm:
    empty: "<gray>Place items in the left pane"
    blocked: "<red>Remove the items marked red first"
    ready: "<green><bold>Confirm trade</bold>"
    # <items>, <levels>
    ready-lore: "<gray><items> item(s) for <green><levels></green> XP levels"
  # <items>, <levels>, <dust> (empty or traded-dust)
  traded: "<prefix><green>Traded <white><items></white> item(s) for <white><levels></white> XP levels in bottles<dust>."
  # <dust>: how many
  traded-dust: " and <white><dust></white> Magic Dust"
  rejected: "<prefix><red>The Tinkerer only takes opened books and enchanted gear."

alchemist:
  console: "<prefix><gray>The Alchemist is for players."
  title: "<dark_gray>Alchemist"
  plus: "<gray>+"
  arrow: "<gray>→"
  filler: " "
  preview:
    empty: "<gray>Place two matching books or dusts"
    mismatch: "<red>These don't combine"
    mismatch-hint: "<gray>Two books of one enchant and level (below max),"
    mismatch-hint2: "<gray>or two Magic Dusts of one tier (not Legendary)."
    # <cost>
    cost: "<gray>Cost: <green><cost></green> XP levels"
  confirm:
    empty: "<gray>Nothing to combine"
    blocked: "<red>These don't combine"
    ready: "<green><bold>Combine</bold>"
    # <cost>, <levels>
    ready-lore: "<gray>Costs <green><cost></green> levels; you have <white><levels></white>"
  # <result>, <cost>
  combined: "<prefix><green>Combined into <white><result></white> for <white><cost></white> levels."
  # <cost>, <levels>
  too-poor: "<prefix><red>You need <white><cost></white> levels to combine these; you have <levels>."
  mismatch: "<prefix><red>Those two don't combine."

xp-bottle:
  # <levels>
  used: "<prefix><green>+<levels> XP levels."

alerts:
  # Sent to everyone with ascent.staff.alerts.
  # <item>, <observed>, <created>, <holders>
  dupe: "<prefix><red><bold>DUPE ALERT</bold> <gray>item <white><item></white> seen <red><observed></red> times, created <white><created></white>. Held by <white><holders></white>. <gray>Check it with <white>/ascent item lookup <item>"
