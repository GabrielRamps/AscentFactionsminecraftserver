# ---- Project ----
ascentVersion=0.1.0-SNAPSHOT

# ---- Server pins (read by server/*.sh) ----
# Minecraft version the Paper server runs. Keep in sync with `paper` in gradle/libs.versions.toml.
mcVersion=1.21.11
# Paper build number, or "latest" for the newest build of mcVersion.
paperBuild=latest

# ---- Gradle ----
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
