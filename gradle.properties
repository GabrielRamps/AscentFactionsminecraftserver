group=gg.ascent
version=0.1.0-SNAPSHOT

# Paper API pinned to the exact server line we run. scripts/update-paper.sh
# rewrites this value (and paperVersion/paperBuild below) when you pull a new
# server jar, so the compile-time API never drifts from the running server.
#
# VERIFY BEFORE FIRST BUILD: run scripts/update-paper.sh to confirm the current
# stable 1.21.x line and rewrite these three values.
paperApiVersion=1.21.8-R0.1-SNAPSHOT
paperVersion=1.21.8
paperBuild=latest

# Where copyToServer drops the built jar. Override per machine in
# ~/.gradle/gradle.properties or with -PascentServerDir=/path/to/server
ascentServerDir=

# The --add-exports/--add-opens flags are required by google-java-format (used by
# Spotless) when it runs on JDK 16+. Without them `./gradlew spotlessApply` fails
# with an IllegalAccessError against the javac internals.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m \
  --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  --add-opens jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED \
  --add-opens jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
