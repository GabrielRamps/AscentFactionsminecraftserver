name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # A real MariaDB for the database integration tests (E1-S2). The same image
    # docker-compose.yml runs on the dev box. Tests read ASCENT_TEST_DB_* below
    # and skip themselves when the URL is unset, so `./gradlew build` still
    # passes on a laptop without a database.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ascent_test
          MARIADB_USER: ascent
          MARIADB_PASSWORD: ascent
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      ASCENT_TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/ascent_test
      ASCENT_TEST_DB_USER: ascent
      ASCENT_TEST_DB_PASSWORD: ascent

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ascent-jar
          path: ascent-plugin/build/libs/Ascent-*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
