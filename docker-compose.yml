# Datastores for a single Ascent environment (PRD §6.7).
#
# Both ports bind to 127.0.0.1 only: the host firewall exposes 25565-25567 and
# SSH, and nothing else should be reachable from the internet.
#
# Usage:
#   cp .env.example .env && edit .env
#   docker compose up -d
#   docker compose ps
#
# Run one stack per environment by pointing at a different env file and project
# name, e.g. `docker compose -p ascent-beta --env-file .env.beta up -d`.

name: ascent

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-ascent_dev}
      MARIADB_USER: ${MARIADB_USER:-ascent}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-storage-engine=InnoDB
      - --innodb-buffer-pool-size=${MARIADB_BUFFER_POOL:-1G}
      - --innodb-flush-log-at-trx-commit=2
      - --max-connections=200
      - --transaction-isolation=READ-COMMITTED
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Everything Ascent keeps in Redis (F-Top, baltop, short-lived caches) is
    # rebuildable from MariaDB, so LRU eviction is safe. MariaDB is the only
    # source of truth.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mariadb-data:
  redis-data:
