# Template for the dev server's server.properties (story E0-S1).
# Let the server generate its own file on first boot, then copy this over it and
# restart. Keys marked [PRD] are required by the PRD and should not drift.

# --- Identity --------------------------------------------------------------
motd=§6Ascent Factions §7| §fdev
server-port=25565
max-players=200
# [PRD] E0-S1
online-mode=true
# 1.8 clients cannot sign chat, so secure profiles must be off for ViaRewind.
enforce-secure-profile=false
white-list=false
enforce-whitelist=false

# --- Performance -----------------------------------------------------------
# [PRD] E0-S1
view-distance=6
# [PRD] E0-S1
simulation-distance=4
network-compression-threshold=256
sync-chunk-writes=false
max-tick-time=60000
entity-broadcast-range-percentage=100

# --- Gameplay --------------------------------------------------------------
# [PRD] E0-S1
spawn-protection=0
# [PRD] E0-S1; also required by /f fly in Epic 6
allow-flight=true
difficulty=hard
gamemode=survival
force-gamemode=false
pvp=true
hardcore=false
allow-nether=true
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
generate-structures=true
level-name=world
level-seed=
level-type=minecraft\:normal
max-world-size=29999984

# --- Safety ----------------------------------------------------------------
enable-command-block=false
op-permission-level=4
function-permission-level=2
broadcast-console-to-ops=true
broadcast-rcon-to-ops=true
enable-rcon=false
enable-query=false
player-idle-timeout=0
prevent-proxy-connections=false
hide-online-players=false
